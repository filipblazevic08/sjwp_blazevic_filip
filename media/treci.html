<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
   .container{
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
   }
   .kartica{
    background: red;
    padding: 40px;
    text-align: center;
    border-radius: 10px;
   }
   @media(max-width:1024px){
    .container{
      grid-template-columns: repeat(2,1fr);
    }
   }
   @media(max-width:767px){
    .container{
      grid-template-columns: 1fr;
    }
   }

  </style>
</head>
<body>
  <div class="container">
    <div class="kartica">1</div>
    <div class="kartica">2</div>
    <div class="kartica">3</div>
    <div class="kartica">4</div>
    <div class="kartica">5</div>
    <div class="kartica">6</div>
    <div class="kartica">7</div>
    <div class="kartica">8</div>
  </div>
</body>
</html>
